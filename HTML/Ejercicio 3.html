
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>

<body>
 
    <h1>Formulario de Registro</h1>

    <p>Completa los siguientes campos para registrarte.</p>

    <form action="#" method="post">

        <!-- Información personal -->
        <fieldset>
            <legend>Información Personal</legend>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" value= "Tu nombre" style="color: #777777;" required>
            <br><br>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" value= "Tu apellido" style="color: #777777;" required>
            <br><br>

            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNacimiento"
                name="fechaNacimiento" required>
            <br><br>
            <label for=" Nombredeusuario">Nombre de usuario:</label>
            <input type="text" id=" Nombredeusuario" name=" Nombredeusuario" required>
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" required>
            <br><br>
            <p>Género:</p>

            <input type="radio" id="masculino"
                name="genero" value="Masculino" required>
            <label for="masculino">Masculino</label>
            <br>

            <input type="radio" id="femenino"
                name="genero" value="Femenino">
            <label for="femenino">Femenino</label>
            <br>

            <input type="radio" id="otro"
                name="genero" value="Otro">
            <label for="otro">Otro</label>

        </fieldset>

        <br>

        <!-- Información de contacto -->
        <fieldset>
            <legend>Información de Contacto</legend>

            <label for="correo">Dirección de Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" value="ejemplo@dominio.com" style="color: #777777;" required>
            <br><br>

            <label for="telefono">Número de Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" value="1234567890" style="color: #777777;" required>
            <br><br>

            <label for="direccion">Dirección:</label>
            <br>
            <textarea id="direccion" name="direccion"
                rows="4" cols="40"></textarea>

        </fieldset>

        <br>

        <!-- Información de cuenta -->
        <fieldset>
            <legend>Información de Cuenta</legend>

            <label for="usuario">Nombre de Usuario:</label>
            <input type="text" id="usuario" name="usuario" required>
            <br><br>

            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena"
                name="contrasena" required>
            <br><br>

            <label for="confirmacion">Confirmación de Contraseña:</label>
            <input type="password" id="confirmacion"
                name="confirmacion" required>

        </fieldset>

        <br>

        <!-- Preferencias -->
        <fieldset>
            <legend>Preferencias</legend>

            <label for="color">Color Favorito:</label>
            <select id="color" name="color" SIZE="1" required>
                <option value="">Selecciona un color</option>
                <option value="Rojo">Rojo</option>
                <option value="Azul">Azul</option>
                <option value="Verde">Verde</option>
                <option value="Amarillo">Amarillo</option>
            </select>

            <br><br>  

            <input type="checkbox" id="terminos"
                name="terminos" required>
            <label for="terminos">
                Acepto los Términos y Condiciones
            </label>

        </fieldset>

        <br>

        <button type="submit">Registrarse</button>
        <button type="reset">Borrar formulario</button>

    </form>

    <script>
        const formulario = document.querySelector("form");
        const contrasena = document.getElementById("contrasena");
        const confirmacion = document.getElementById("confirmacion");

        formulario.addEventListener("submit", function (event) {
            if (contrasena.value !== confirmacion.value) {
                event.preventDefault();
                confirmacion.setCustomValidity(
                    "Las contraseñas no coinciden."
                );
                confirmacion.reportValidity();
            } else {
                confirmacion.setCustomValidity("");
            }
        });

        confirmacion.addEventListener("input", function () {
            confirmacion.setCustomValidity("");
        });
    </script>

</body>

</html>

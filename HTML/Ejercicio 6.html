<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera de Cine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }

        h1 {
            text-align: center;
            font-size: 3em;
            margin-bottom: 30px;
        }

        /* Sección de Thumbnails superiores */
        .thumbnails-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 80px;
        }

        .thumbnail {
            width: 180px;
            height: 260px;
            object-fit: cover;
            border: 1px solid #ccc;
            transition: transform 0.2s ease;
        }

        .thumbnail:hover {
            transform: scale(1.05);
        }

        /* Fichas detalladas de las películas */
        .pelicula-detalle {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            max-width: 600px;
        }

        .pelicula-detalle h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        .poster-grande {
            width: 100%;
            max-width: 450px;
            height: auto;
            display: block;
            margin-bottom: 20px;
        }

        .info-tecnica {
            margin-bottom: 15px;
        }

        .sinopsis {
            text-align: justify;
        }

        .volver-arriba {
            display: inline-block;
            margin-top: 15px;
            color: #0066cc;
            text-decoration: none;
        }

        .volver-arriba:hover {
            text-decoration: underline;
        }
    </style>
</head>
